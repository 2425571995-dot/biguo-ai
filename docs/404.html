<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>页面不存在 · 毕过AI</title>
<meta name="robots" content="noindex">

<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#f0f4f8;color:#1e293b;min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .box{max-width:460px;text-align:center}
  .code{font-size:76px;font-weight:900;line-height:1;background:linear-gradient(135deg,#2563eb,#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent}
  h1{font-size:21px;margin:14px 0 8px}
  p{font-size:14px;color:#64748b;line-height:1.7}
  .links{margin-top:26px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  a{
    text-decoration:none;font-size:14px;font-weight:600;padding:11px 20px;border-radius:10px;
    transition:all .2s;
  }
  .p{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff}
  .p:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(37,99,235,.3)}
  .g{background:#fff;color:#475569;border:1px solid #e2e8f0}
  .g:hover{border-color:#2563eb;color:#2563eb}
  .foot{margin-top:30px;font-size:12px;color:#94a3b8}
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>

    <p>链接可能输错了，或者页面已经调整过位置。<br>下面几个入口都能用：</p>
    <div class="links">

      <a class="g" href="/#aigc">AIGC 自查</a>

  </div>
