name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
      VITE_MODEL: ${{ vars.VITE_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node -e "require('fs').writeFileSync('.env.production', 'VITE_API_KEY=' + process.env.VITE_API_KEY + '\nVITE_API_BASE_URL=' + process.env.VITE_API_BASE_URL + '\nVITE_MODEL=' + process.env.VITE_MODEL + '\n')"
      - run: cat .env.production | sed 's/=.*/=***/'
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
